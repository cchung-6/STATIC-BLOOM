<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Static Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#e3a857;
    --panel-bg:#0a0908;
    --panel-fg:#f5f2ea;
    --panel-muted:#9a9488;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'JetBrains Mono', monospace;
    background:#050505;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; overflow:auto; padding:32px;
  }
  /* 터치 기기(호버 불가)에서는 글로우/커서 등 hover 전용 스타일을 아예 무력화 */
  @media (hover:none){
    .char-visual.hover{ filter:none; }
    .hit-layer{ cursor:default !important; }
  }

  /* 사이트 전체를 감싸는 프레임: 화면을 꽉 채우지 않고 중앙에 살짝 축소된 크기로 배치 */
  /* 기본값(JS 미실행 시 대비용) — 실제 크기는 JS가 window 크기를 재서 인라인 style로 덮어씀 */
  .site{
    position:relative;
    width:min(88vw, 1320px, calc(88vh * 1801 / 1200));
    aspect-ratio:1801 / 1200; /* JS 로드 전 잠깐 보이는 기본 비율(JS가 곧 width/height를 직접 덮어씀) */
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
    flex:0 0 auto;
  }

  /* ---------- 무대 ---------- */
  .stage{ position:relative; width:100%; height:100%; overflow:hidden; }
  .stage-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .stage-vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }
  .brand{
    position:absolute; top:24px; left:32px; z-index:30;
    font-family:'Anton', sans-serif; letter-spacing:.12em; font-size:14px;
    color:rgba(245,242,234,.75); text-transform:uppercase;
  }

  /*
    캐릭터 PNG가 배경(1801x1200)과 동일한 캔버스 크기로 저장되어 있으므로,
    "그림"은 배경과 똑같이 화면 전체를 덮게 깔고(char-visual),
    "클릭/호버 판정 영역"만 실제 인물이 서 있는 자리에 작은 박스로 따로 둔다(char-hit).
  */
  .char-visual{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:10;
    pointer-events:none;
    transition:filter .35s ease;
  }
  .char-visual.hover{ filter:drop-shadow(0 0 22px rgba(227,168,87,.55)); }
  /* 선택되지 않은 인물: 어둡게. 선택된 인물: 오버레이보다 위(z-index)로 올려서 오버레이에 안 가려지게 */
  .stage.detail-open .char-visual:not(.active){ filter:brightness(.28) saturate(.55); }
  .char-visual.active{ filter:none !important; z-index:16; }

  .bg-dim{
    position:absolute; inset:0; z-index:15;
    background:rgba(0,0,0,.78);
    opacity:0; pointer-events:none;
    transition:opacity .4s ease;
  }
  .stage.detail-open .bg-dim{ opacity:1; pointer-events:auto; cursor:pointer; }

  /* 히트박스 좌표(--x/--y/--w/--h, % 단위) — 실제 그림 보면서 인물 위치에 맞게 조정 */
  .hit-layer{ position:absolute; inset:0; z-index:20; cursor:default; }

  /* 키보드 접근용(스크린리더/Tab) — 마우스로는 안 보이지만 Tab으로 포커스하면 나타남 */
  .kbd-nav button{
    position:absolute; left:-9999px; top:16px;
    background:#000; color:#fff; border:1px solid var(--accent);
    padding:8px 14px; font-family:'JetBrains Mono',monospace; font-size:12px; cursor:pointer;
    z-index:1000;
  }
  .kbd-nav button:focus{ left:16px; }
  .kbd-nav button:nth-of-type(1):focus{ top:16px; }
  .kbd-nav button:nth-of-type(2):focus{ top:54px; }
  .kbd-nav button:nth-of-type(3):focus{ top:92px; }
  .kbd-nav button:nth-of-type(4):focus{ top:130px; }

  /* ---------- 커서 툴팁 ---------- */
  .tooltip{
    position:fixed; top:0; left:0; z-index:950;
    background:#000; color:#fff; border:1px solid rgba(255,255,255,.15);
    padding:10px 14px; min-width:150px;
    font-size:12px; line-height:1.7; white-space:nowrap;
    opacity:0; transform:translate(-9999px,-9999px);
    transition:opacity .15s ease; pointer-events:none;
  }
  .tooltip.show{ opacity:1; }
  .tooltip-name{
    font-family:'Anton', sans-serif; letter-spacing:.05em; font-size:13px;
    color:var(--accent); text-transform:uppercase; margin-bottom:6px;
  }
  .tooltip-row{ display:flex; gap:10px; }
  .tooltip-row span{ color:#8f8f8f; min-width:36px; }
  .tooltip-row b{ font-weight:500; color:#fff; }

  /* ---------- 상세 정보 패널 ---------- */
  .panel{
    position:absolute; top:0; right:0; z-index:900;
    width:50%; height:100%;
    background:var(--panel-bg); color:var(--panel-fg);
    display:flex; flex-direction:column;
    box-shadow:-24px 0 60px rgba(0,0,0,.55);
    transform:translateX(100%);
    transition:transform .45s cubic-bezier(.16,.8,.24,1);
  }
  /* C, D처럼 오른쪽에 서 있는 캐릭터는 패널이 왼쪽에서 나옴 */
  .panel.panel-left{
    right:auto; left:0;
    box-shadow:24px 0 60px rgba(0,0,0,.55);
    transform:translateX(-100%);
  }
  .panel.open{ transform:translateX(0); }
  /* 방향(좌/우) 재설정 순간에만 트랜지션을 잠깐 꺼서, 화면을 가로지르는 이동 없이 반대쪽에 즉시 스냅시킴 */
  .panel.no-anim{ transition:none !important; }

  .panel-topbar{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:28px 28px 20px 40px;
    border-bottom:1px solid rgba(245,242,234,.15);
  }
  .panel-titles{ display:flex; flex-direction:column; gap:8px; }
  .panel-id{ font-size:12px; letter-spacing:.3em; color:var(--accent); }
  .panel-name{
    font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:.02em;
    font-size:clamp(26px,3vw,42px); line-height:1;
  }
  .panel-name .name-ko{
    font-family:'Black Han Sans', sans-serif; letter-spacing:0;
  }
  .panel-close{
    width:34px; height:34px; border-radius:50%; flex:0 0 auto;
    background:none; border:1px solid rgba(245,242,234,.3); color:var(--panel-fg);
    font-size:15px; line-height:1; cursor:pointer; transition:.25s ease;
  }
  .panel-close:hover{ background:var(--accent); border-color:var(--accent); color:#111; }

  .panel-image{
    margin:24px 40px 0; aspect-ratio:16/9;
    background:#f5f2ea; color:#8a8578;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:12px; letter-spacing:.15em; border:1px dashed #b8b2a1; padding:12px;
  }

  .panel-info{ padding:24px 40px 40px; overflow-y:auto; }
  .info-row{
    display:flex; gap:14px; padding:10px 0;
    border-bottom:1px dashed rgba(245,242,234,.12); font-size:14px;
  }
  .info-bracket{ color:var(--accent); min-width:100px; }
  .info-desc{
    margin-top:24px; line-height:1.8; font-size:13.5px;
    color:var(--panel-muted); white-space:pre-line;
  }

  @media (max-width:760px){
    body{ padding:0; }
    .site{ border-radius:0; box-shadow:none; }
    /* 패널은 .site 크기에 갇히지 않고 화면(뷰포트) 전체 기준으로 고정 — .site 세로폭이 좁아도 항상 꽉 찬 높이로 뜸 */
    .panel{ position:fixed; top:0; right:0; height:100dvh; width:100%; }
    .panel.panel-left{ right:auto; left:0; }
    .panel-topbar{ padding:22px 20px 16px 24px; flex:0 0 auto; }
    .panel-image{ margin:18px 20px 0; flex:0 0 auto; }
    .panel-info{ padding:18px 20px 30px; flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .brand{ top:16px; left:18px; font-size:12px; }
    .tooltip{ display:none; } /* 모바일은 탭=바로 상세 오픈이라 커서 툴팁 자체가 불필요 */
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

  <div class="site" id="site">
  <div class="stage" id="stage">
    <img class="stage-bg" src="background.png" alt="" />
    <div class="stage-vignette"></div>
    <div class="brand">Static Bloom</div>

    <!-- 캐릭터 그림: 배경과 동일한 풀사이즈로 렌더링 -->
    <img class="char-visual" data-id="A" src="A.png" alt="캐릭터 A" />
    <img class="char-visual" data-id="B" src="B.png" alt="캐릭터 B" />
    <img class="char-visual" data-id="C" src="C.png" alt="캐릭터 C" />
    <img class="char-visual" data-id="D" src="D.png" alt="캐릭터 D" />

    <div class="bg-dim" id="bgDim"></div>

    <!-- 클릭/호버 판정: 좌표 대신 각 PNG의 실제(투명하지 않은) 픽셀을 읽어서 판정 -->
    <div class="hit-layer" id="hitLayer"></div>

    <!-- 키보드 사용자를 위한 대체 진입점 (마우스 시야에는 없음) -->
    <div class="kbd-nav" id="kbdNav" aria-label="밴드 멤버 선택">
      <button type="button" data-id="A">캐릭터 A 상세정보</button>
      <button type="button" data-id="B">캐릭터 B 상세정보</button>
      <button type="button" data-id="C">캐릭터 C 상세정보</button>
      <button type="button" data-id="D">캐릭터 D 상세정보</button>
    </div>
  </div>

  <div class="tooltip" id="tooltip">
    <div class="tooltip-name" id="ttName"></div>
    <div class="tooltip-row"><span>나이</span><b id="ttAge"></b></div>
    <div class="tooltip-row"><span>성별</span><b id="ttGender"></b></div>
    <div class="tooltip-row"><span>키</span><b id="ttHeight"></b></div>
    <div class="tooltip-row"><span>포지션</span><b id="ttPosition"></b></div>
  </div>

  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-topbar">
      <div class="panel-titles">
        <span class="panel-id" id="panelId"></span>
        <span class="panel-name" id="panelName"></span>
      </div>
      <button class="panel-close" id="panelClose" aria-label="닫기">✕</button>
    </div>
    <div class="panel-image" id="panelImage" style="border:1px dashed #b8b2a1;">가로 이미지 자리</div>
    <div class="panel-info">
      <div class="info-row"><span class="info-bracket">[ 나이 ]</span><span id="infoAge"></span></div>
      <div class="info-row"><span class="info-bracket">[ 성별 ]</span><span id="infoGender"></span></div>
      <div class="info-row"><span class="info-bracket">[ 키 ]</span><span id="infoHeight"></span></div>
      <div class="info-row"><span class="info-bracket">[ 포지션 ]</span><span id="infoPosition"></span></div>
      <p class="info-desc" id="infoDesc"></p>
    </div>
  </aside>
  </div>

<script>
  // ===== 여기 데이터만 수정하면 내용 반영됨 =====
  const CHAR_DATA = {
    A: { name:'JODY FLANAGAN', nameKo:'조디 플래너건', age:'26', gender:'남성', height:'188cm', position:'드럼', desc:'느긋함과 무심함만 놓고 보면 세상 편한 사람처럼 보인다. 실제로도 웬만한 일에는 먼저 나서지 않고, 갈등이 생기면 조용히 빠져 있는 쪽을 택한다. 문제는 의견이 없는 게 아니라는 것. 실력 하나만큼은 확실해서 다른 밴드들의 스카우트 제의를 꽤 자주 받고 있는데, 정작 본인은 어디에 속해야 할지 아직도 고민하는 모양이다. 친형의 유명세에 묘한 열등감을 품고 있는 것도 사실이고.', image:'A-1.png' },
    B: { name:'NOAH GRANT', nameKo:'노아 그랜트', age:'24', gender:'남성', height:'184cm', position:'보컬', desc:'사교와 능청을 제외하면 그를 설명할 수 없다. 공연에서도, 공연 밖에서도 유독 사람들의 반응을 즐기는 편인데. 그게 많이 심하다는 것이 단점일까. 물론, 몸이 너무 가볍다는 것도 빼먹을 수 없고…. 타고난 음악적 재능을 소유 중이지만, 자신감의 근원지는 되지 못하는 모양. 외로움을 많이 탄다.', image:'B-1.png' },
    C: { name:'MATEO VEGA', nameKo:'마태오 베가', age:'25', gender:'남성', height:'185cm', position:'리드기타', desc:'팀의 접착제. 사교적이고 친구도 많으며 분위기가 가라앉는 꼴을 잘 못 보는 편이라, 밴드 안에서는 자연스럽게 분위기 메이커를 맡고 있다. (블룸을 잘 모르는 사람들은 보통 노아라고 생각하지만, 사실 아니다.) 권위적인 사람을 유독 싫어하고 뒤에서 한마디씩 얹는 성격도 빼놓을 수 없다. 그래도 자기 사람이라고 생각하는 상대에게만큼은 꽤 다정한 편이다.', image:'C-1.png' },
    D: { name:'CHAZ COLTON', nameKo:'채즈 콜튼', age:'25', gender:'남성', height:'191cm', position:'베이스', desc:'좋게 말하면 계획형, 나쁘게 말하면 컨트롤프릭. 밴드의 스케줄부터 돈 문제까지 죄다 붙잡고 있는 탓에, 멤버들 입장에선 가끔 잔소리쟁이 맏형처럼 보이기도 한다. 무뚝뚝하고 무심한 편이지만, 정작 신경 쓰기 시작하면 지나치게 많이 신경 쓴다는 것이 문제일지도. 음악에 관해서도 꽤나 까다로워서, 사소한 부분 하나를 붙잡고 몇 시간이고 늘어질 수 있는 타입이다.', image:'D-1.png' },
  };
  // C, D는 무대 오른쪽에 서 있으므로 패널이 왼쪽에서 나옴
  const LEFT_PANEL_IDS = ['C', 'D'];
  const PANEL_TRANSITION_MS = 460; // CSS transition 시간과 맞춰둠
  const CHAR_IDS = ['A', 'B', 'C', 'D'];
  const ALPHA_THRESHOLD = 15;   // 이 값보다 투명하면(알파 낮으면) "인물 아님"으로 판정
  const SAMPLE_WIDTH = 480;     // 알파 판정용으로 축소해서 읽는 캔버스 가로 크기(성능용, 클수록 정밀)
  // ================================================

  const stage    = document.getElementById('stage');
  const site     = document.getElementById('site');
  const bgDim    = document.getElementById('bgDim');
  const tooltip  = document.getElementById('tooltip');
  const panel    = document.getElementById('panel');
  const hitLayer = document.getElementById('hitLayer');
  const visuals  = document.querySelectorAll('.char-visual');

  let activeId = null;
  let hoveredId = null;
  let switchTimer = null;
  const alphaMaps = {}; // id -> { w, h, data } | null(CORS 등으로 못 읽은 경우)

  // CSS의 vh/dvh는 모바일 브라우저 주소창 유무에 따라 오차가 생기기 쉬워서,
  // 실제 보이는 창 크기(window.innerWidth/innerHeight)를 JS로 직접 재서
  // .site 크기를 강제로 계산한다(비율 1801:1200 유지, 화면 안에 완전히 들어가도록).
  const SITE_RATIO = 1801 / 1200;
  function fitSiteToViewport(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const isMobile = vw <= 760;
    const padding = isMobile ? 0 : 32; // body 기본 padding과 동일하게 맞춤
    const maxW = vw - padding * 2;
    const maxH = vh - padding * 2;
    let w = maxW;
    let h = w / SITE_RATIO;
    if (h > maxH){
      h = maxH;
      w = h * SITE_RATIO;
    }
    site.style.width  = Math.floor(w) + 'px';
    site.style.height = Math.floor(h) + 'px';
  }
  fitSiteToViewport();
  window.addEventListener('resize', fitSiteToViewport);
  window.addEventListener('orientationchange', () => setTimeout(fitSiteToViewport, 50));
  const fallbackBoxes = {}; // id -> {minX,minY,maxX,maxY} (0~1 비율) — 알파맵 실패 시 사각형 판정용

  function visualOf(id){ return document.querySelector('.char-visual[data-id="' + id + '"]'); }

  // 알파맵이 실패했을 때를 대비해, 같은 캔버스에서 "불투명 픽셀의 대략적인 사각 범위"도 함께 계산해둔다.
  function computeFallbackBox(id, w, h, data){
    let minX=w, minY=h, maxX=0, maxY=0, found=false;
    for (let y=0; y<h; y+=2){
      for (let x=0; x<w; x+=2){
        if (data[(y*w+x)*4+3] > ALPHA_THRESHOLD){
          found = true;
          if (x<minX) minX=x; if (x>maxX) maxX=x;
          if (y<minY) minY=y; if (y>maxY) maxY=y;
        }
      }
    }
    if (!found) return null;
    return { minX:minX/w, minY:minY/h, maxX:maxX/w, maxY:maxY/h };
  }

  // 각 캐릭터 PNG를 오프스크린 캔버스에 그려서 알파(투명도) 값을 읽어둔다.
  // index.html과 같은 저장소(같은 오리진)의 상대경로 이미지이므로 CORS 설정이 필요 없음.
  function buildAlphaMaps(){
    const jobs = CHAR_IDS.map(id => new Promise(resolve => {
      const src = visualOf(id).src;
      const img = new Image();
      img.onload = () => {
        const scale = SAMPLE_WIDTH / img.naturalWidth;
        const w = SAMPLE_WIDTH, h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently:true });
        ctx.drawImage(img, 0, 0, w, h);
        try{
          const data = ctx.getImageData(0, 0, w, h).data;
          alphaMaps[id] = { w, h, data };
          fallbackBoxes[id] = computeFallbackBox(id, w, h, data);
        }catch(err){
          alphaMaps[id] = null;
          console.warn('[StaticBloom] ' + id + ' 알파 판정 실패(CORS?) — 사각형 히트박스로 대체합니다.', err);
        }
        resolve();
      };
      img.onerror = () => { alphaMaps[id] = null; resolve(); };
      img.src = src;
    }));
    return Promise.all(jobs);
  }

  function alphaAt(id, nx, ny){
    const m = alphaMaps[id];
    if (!m) return -1; // -1: 알파맵 자체가 없음(대체 판정 필요) / 0: 알파맵은 있는데 투명한 지점
    const x = Math.min(m.w - 1, Math.max(0, Math.floor(nx * m.w)));
    const y = Math.min(m.h - 1, Math.max(0, Math.floor(ny * m.h)));
    return m.data[(y * m.w + x) * 4 + 3];
  }

  // 알파맵이 없는(CORS 등으로 실패한) 캐릭터는, 미리 계산해둔 대략적인 사각 범위로 대신 판정
  function hitsFallbackBox(id, nx, ny){
    const b = fallbackBoxes[id];
    if (!b) return false;
    return nx >= b.minX && nx <= b.maxX && ny >= b.minY && ny <= b.maxY;
  }

  // 화면 좌표 -> .site 기준 0~1 비율로 바꾼 뒤, 각 인물 PNG의 알파값을 검사
  function hitTest(clientX, clientY){
    const rect = site.getBoundingClientRect();
    const nx = (clientX - rect.left) / rect.width;
    const ny = (clientY - rect.top) / rect.height;
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return null;
    for (let i = CHAR_IDS.length - 1; i >= 0; i--){
      const id = CHAR_IDS[i];
      const a = alphaAt(id, nx, ny);
      if (a === -1){
        if (hitsFallbackBox(id, nx, ny)) return id;
      } else if (a > ALPHA_THRESHOLD){
        return id;
      }
    }
    return null;
  }

  function fillTooltip(id){
    const d = CHAR_DATA[id];
    document.getElementById('ttName').textContent = d.name;
    document.getElementById('ttAge').textContent = d.age;
    document.getElementById('ttGender').textContent = d.gender;
    document.getElementById('ttHeight').textContent = d.height;
    document.getElementById('ttPosition').textContent = d.position;
  }

  function positionTooltip(x, y){
    const pad = 18;
    let left = x + pad, top = y + pad;
    const rect = tooltip.getBoundingClientRect();
    if (left + rect.width > window.innerWidth - 8)  left = x - rect.width - pad;
    if (top  + rect.height > window.innerHeight - 8) top  = y - rect.height - pad;
    tooltip.style.left = left + 'px';
    tooltip.style.top  = top + 'px';
  }

  function fillPanelContent(id){
    const d = CHAR_DATA[id];
    document.getElementById('panelId').textContent = '';
    document.getElementById('panelName').innerHTML = d.name + (d.nameKo ? ' • <span class="name-ko">' + d.nameKo + '</span>' : '');
    document.getElementById('infoAge').textContent = d.age;
    document.getElementById('infoGender').textContent = d.gender;
    document.getElementById('infoHeight').textContent = d.height;
    document.getElementById('infoPosition').textContent = d.position;
    document.getElementById('infoDesc').textContent = d.desc;

    const imgBox = document.getElementById('panelImage');
    if (d.image){
      imgBox.innerHTML = '<img src="' + d.image + '" alt="' + d.name + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
      imgBox.style.border = 'none';
      imgBox.style.padding = '0';
    } else {
      imgBox.textContent = '가로 이미지 자리';
      imgBox.style.border = '1px dashed #b8b2a1';
      imgBox.style.padding = '12px';
    }
  }

  // 패널을 "지금 붙어있는 쪽"으로 완전히 닫은 뒤(슬라이드 아웃), 새 인물 쪽에서 다시 슬라이드 인.
  // 좌/우 방향을 바꾸는 순간에는 transition을 잠깐 꺼서(no-anim) 화면을 가로지르지 않고
  // 반대쪽 "닫힌 위치"로 즉시 스냅시킨 뒤, 그 다음 프레임부터 다시 열리는 애니메이션만 재생한다.
  function slideInFrom(id){
    fillPanelContent(id);

    panel.classList.add('no-anim');
    panel.classList.toggle('panel-left', LEFT_PANEL_IDS.includes(id));
    void panel.offsetWidth; // 강제 리플로우: transition 없이 새 방향의 닫힌 위치로 즉시 이동
    panel.classList.remove('no-anim');

    requestAnimationFrame(() => {
      void panel.offsetWidth;
      panel.classList.add('open');
    });
  }

  function setSelection(id){
    visuals.forEach(v => v.classList.toggle('active', v.dataset.id === id));
  }

  function openDetail(id){
    if (activeId === id) return;

    clearTimeout(switchTimer);
    stage.classList.add('detail-open');
    setSelection(id);
    tooltip.classList.remove('show');
    visuals.forEach(v => v.classList.remove('hover'));

    if (activeId === null){
      // 처음 여는 경우: 바로 해당 방향에서 슬라이드 인
      slideInFrom(id);
    } else {
      // 이미 다른 인물 패널이 열려있는 경우: 지금 방향으로 먼저 완전히 닫고, 다 닫힌 뒤 새 방향에서 연다
      panel.classList.remove('open');
      switchTimer = setTimeout(() => slideInFrom(id), PANEL_TRANSITION_MS);
    }

    activeId = id;
    panel.setAttribute('aria-hidden', 'false');
  }

  function closeDetail(){
    if (!activeId) return;
    clearTimeout(switchTimer);
    activeId = null;
    setSelection(null);
    stage.classList.remove('detail-open');
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
  }

  hitLayer.addEventListener('mousemove', (e) => {
    if (activeId) return;
    const hit = hitTest(e.clientX, e.clientY);
    if (hit !== hoveredId){
      if (hoveredId) visualOf(hoveredId).classList.remove('hover');
      hoveredId = hit;
      if (hit){
        visualOf(hit).classList.add('hover');
        fillTooltip(hit);
        tooltip.classList.add('show');
      } else {
        tooltip.classList.remove('show');
      }
      hitLayer.style.cursor = hit ? 'pointer' : 'default';
    }
    if (hit) positionTooltip(e.clientX, e.clientY);
  });

  hitLayer.addEventListener('mouseleave', () => {
    if (hoveredId) visualOf(hoveredId).classList.remove('hover');
    hoveredId = null;
    tooltip.classList.remove('show');
  });

  // ---- 터치 기기: hover 개념이 없으므로 탭 = 즉시 상세 오픈 ----
  // touchstart에서 먼저 처리하고, 뒤이어 브라우저가 발생시키는 합성 click은
  // touchHandled 플래그로 걸러서 openDetail이 두 번 불리지 않게 한다.
  let touchHandled = false;
  hitLayer.addEventListener('touchstart', (e) => {
    if (activeId) return; // 패널이 열린 상태의 탭은 bgDim/panel 쪽에서 처리됨
    const t = e.changedTouches[0];
    const hit = hitTest(t.clientX, t.clientY);
    if (hit){
      touchHandled = true;
      openDetail(hit);
    }
  }, { passive:true });

  hitLayer.addEventListener('click', (e) => {
    if (touchHandled){ touchHandled = false; return; }
    const hit = hitTest(e.clientX, e.clientY);
    if (hit) openDetail(hit);
    else if (activeId) closeDetail();
  });

  document.getElementById('kbdNav').addEventListener('click', (e) => {
    const id = e.target.closest('button')?.dataset.id;
    if (id) openDetail(id);
  });

  bgDim.addEventListener('click', closeDetail);
  bgDim.addEventListener('touchstart', closeDetail, { passive:true });
  const panelCloseBtn = document.getElementById('panelClose');
  panelCloseBtn.addEventListener('click', closeDetail);
  panelCloseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); closeDetail(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDetail();
  });

  buildAlphaMaps();
</script>
</body>
</html>
